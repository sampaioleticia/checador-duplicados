<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Checador de Duplicados</title>
<style>
  :root {
    --bg: #191919;
    --card: #1f1f1f;
    --border: rgba(255,255,255,0.07);
    --text: #e9e9e7;
    --muted: #8a8a88;
    --red: #ff7369;
    --red-bg: rgba(255,115,105,0.09);
    --red-border: rgba(255,115,105,0.22);
    --green: #52b8a3;
    --green-bg: rgba(82,184,163,0.08);
    --green-border: rgba(82,184,163,0.22);
    --sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
    --serif: Georgia, 'Iowan Old Style', 'Times New Roman', serif;
  }

  * { box-sizing: border-box; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--serif);
    max-width: 620px;
    margin: 0 auto;
    padding: 64px 24px 80px;
  }

  h1 {
    font-size: 26px;
    font-weight: 600;
    letter-spacing: -0.01em;
    color: #fdfdfc;
    margin: 0 0 32px;
  }

  .stats {
    display: flex;
    gap: 12px;
    margin-bottom: 32px;
  }

  .stat {
    flex: 1;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 18px 20px;
  }

  .stat .numero {
    font-family: var(--sans);
    font-size: 32px;
    font-weight: 600;
    line-height: 1;
    margin-bottom: 6px;
  }

  .stat .rotulo {
    font-family: var(--sans);
    font-size: 13px;
    color: var(--muted);
  }

  .stat.repetidos .numero.tem-repetido { color: var(--red); }
  .stat.repetidos .numero.sem-repetido { color: var(--green); }

  .secao-titulo {
    font-family: var(--sans);
    font-size: 13px;
    color: var(--muted);
    margin-bottom: 10px;
  }

  .linha {
    display: flex;
    flex-direction: column;
    gap: 2px;
    padding: 9px 14px;
    margin-bottom: 5px;
    background: var(--red-bg);
    border: 1px solid var(--red-border);
    border-left: 2px solid var(--red);
    border-radius: 5px;
  }

  .linha-topo {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 16px;
  }

  .nome {
    font-size: 14px;
    color: var(--text);
  }

  .contagem {
    font-family: var(--sans);
    font-size: 11px;
    color: var(--red);
    white-space: nowrap;
    flex-shrink: 0;
  }

  .variantes {
    font-family: var(--sans);
    font-size: 11px;
    color: var(--muted);
  }

  .vazio {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 20px;
    background: var(--green-bg);
    border: 1px solid var(--green-border);
    border-radius: 8px;
    font-family: var(--sans);
    font-size: 14px;
    color: var(--green);
  }

  .carregando, .erro {
    font-family: var(--sans);
    color: var(--muted);
    font-size: 14px;
  }

  .erro { color: var(--red); }
</style>
</head>
<body>
  <h1>Checador de Duplicados</h1>

  <div class="stats">
    <div class="stat">
      <div class="numero" id="num-verificados">&mdash;</div>
      <div class="rotulo">artigos verificados</div>
    </div>
    <div class="stat repetidos">
      <div class="numero" id="num-repetidos">&mdash;</div>
      <div class="rotulo">repetidos</div>
    </div>
  </div>

  <div id="lista-titulo" class="secao-titulo" style="display:none;">Artigos repetidos</div>
  <div id="conteudo" class="carregando">Carregando...</div>

  <script>
    function atualizar() {
      fetch('/api/duplicados')
        .then(r => r.json())
        .then(data => {
          const container = document.getElementById('conteudo');
          const listaTitulo = document.getElementById('lista-titulo');
          const numVerificados = document.getElementById('num-verificados');
          const numRepetidos = document.getElementById('num-repetidos');

          if (data.error) {
            container.className = 'erro';
            container.textContent = 'Erro: ' + JSON.stringify(data.error);
            return;
          }

          const contagem = data.contagem;
          const chaves = Object.keys(contagem).sort((a, b) => a.localeCompare(b));
          const repetidos = chaves.filter(chave => contagem[chave].count > 1);

          numVerificados.textContent = data.total;
          numRepetidos.textContent = repetidos.length;
          numRepetidos.className = 'numero ' + (repetidos.length > 0 ? 'tem-repetido' : 'sem-repetido');

          let html = '';
          if (repetidos.length === 0) {
            listaTitulo.style.display = 'none';
            html = '<div class="vazio">Nenhum artigo repetido no momento.</div>';
          } else {
            listaTitulo.style.display = 'block';
            repetidos.forEach(chave => {
              const item = contagem[chave];
              const temVariacao = item.variantes.length > 1;
              html += `<div class="linha">
                <div class="linha-topo">
                  <span class="nome">${item.exibicao}</span>
                  <span class="contagem">usado ${item.count}x</span>
                </div>
                ${temVariacao ? `<span class="variantes">variações encontradas: ${item.variantes.map(v => '"' + v + '"').join(', ')}</span>` : ''}
              </div>`;
            });
          }

          container.className = '';
          container.innerHTML = html;
        })
        .catch(err => {
          const container = document.getElementById('conteudo');
          container.className = 'erro';
          container.textContent = 'Erro ao carregar: ' + err.message;
        });
    }

    atualizar();
    setInterval(atualizar, 2000);
  </script>
</body>
</html>
