<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Checador de Duplicados</title>
<style>
  body {
    background: #191919;
    color: #e9e9e7;
    font-family: Georgia, 'Times New Roman', serif;
    max-width: 640px;
    margin: 0 auto;
    padding: 48px 24px;
  }
  h1 { font-size: 28px; font-weight: 600; margin-bottom: 4px; color: #fff; }
  .subtitulo { color: #9b9b9b; font-size: 14px; margin-bottom: 32px;
    font-family: -apple-system, 'Segoe UI', sans-serif; }
  .linha { display: flex; justify-content: space-between; align-items: center;
    padding: 14px 16px; margin-bottom: 8px; background: #202020;
    border: 1px solid #2f2f2f; border-radius: 6px; }
  .nome { font-size: 16px; }
  .badge { font-size: 12px; padding: 3px 10px; border-radius: 12px; white-space: nowrap;
    font-family: -apple-system, 'Segoe UI', sans-serif; }
  .resumo-topo { color: #9b9b9b; font-size: 14px; margin-bottom: 24px;
    font-family: -apple-system, 'Segoe UI', sans-serif; }
  .resumo-topo .separador { margin: 0 8px; }
  .tudo-livre { color: #4dd58a; font-size: 15px; padding: 16px;
    background: rgba(45,194,117,0.08); border: 1px solid rgba(77,213,138,0.25);
    border-radius: 6px; font-family: -apple-system, 'Segoe UI', sans-serif; }
  .carregando, .erro { color: #9b9b9b; font-family: -apple-system, 'Segoe UI', sans-serif; }
</style>
</head>
<body>
  <h1>Checador de Duplicados</h1>
  <div class="subtitulo">Nome do Artigo &middot; base de dados do Notion</div>
  <div id="resumo-topo" class="resumo-topo"></div>
  <div id="conteudo" class="carregando">Carregando...</div>

  <script>
    function atualizar() {
      fetch('/api/duplicados')
        .then(r => r.json())
        .then(data => {
          const container = document.getElementById('conteudo');
          const resumoTopo = document.getElementById('resumo-topo');

          if (data.error) {
            container.className = 'erro';
            container.textContent = 'Erro: ' + JSON.stringify(data.error);
            return;
          }

          const contagem = data.contagem;
          const nomes = Object.keys(contagem).sort((a, b) => a.localeCompare(b));
          const repetidos = nomes.filter(nome => contagem[nome] > 1);

          resumoTopo.innerHTML = `
            <span>${nomes.length} artigos verificados</span>
            <span class="separador">&middot;</span>
            <span style="color:${repetidos.length > 0 ? '#ff8080' : '#4dd58a'}">${repetidos.length} repetidos</span>
          `;

          let html = '';
          if (repetidos.length === 0) {
            html = '<div class="tudo-livre">Nenhum artigo repetido encontrado.</div>';
          } else {
            repetidos.forEach(nome => {
              const vezes = contagem[nome];
              html += `<div class="linha">
                <span class="nome">${nome}</span>
                <span class="badge" style="background:rgba(235,87,87,0.15); color:#ff8080; border:1px solid rgba(235,87,87,0.35);">
                  Já foi lido &middot; usado ${vezes}x
                </span>
              </div>`;
            });
          }

          container.className = '';
          container.innerHTML = html;
        })
        .catch(err => {
          const container = document.getElementById('conteudo');
          container.className = 'erro';
          container.textContent = 'Erro ao carregar: ' + err.message;
        });
    }

    atualizar();
    setInterval(atualizar, 2000);
  </script>
</body>
</html>
