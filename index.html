<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Checador de Duplicados</title>
<style>
  :root {
    --bg: #191919;
    --border: rgba(255,255,255,0.07);
    --text: #e9e9e7;
    --muted: #8a8a88;
    --red: #ff7369;
    --green: #52b8a3;
    --sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
    --serif: Georgia, 'Iowan Old Style', 'Times New Roman', serif;
  }

  * { box-sizing: border-box; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--serif);
    max-width: 460px;
    margin: 0 auto;
    padding: 56px 24px 64px;
  }

  h1 {
    font-size: 19px;
    font-weight: 600;
    letter-spacing: -0.01em;
    color: #fdfdfc;
    margin: 0 0 14px;
  }

  .status {
    display: flex;
    align-items: center;
    gap: 8px;
    font-family: var(--sans);
    font-size: 13px;
    color: var(--muted);
    margin-bottom: 20px;
  }

  .ponto {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    flex-shrink: 0;
  }

  .ponto.ok { background: var(--green); }
  .ponto.alerta { background: var(--red); }

  .status .destaque.ok { color: var(--green); }
  .status .destaque.alerta { color: var(--red); }

  .linha {
    display: flex;
    flex-direction: column;
    gap: 1px;
    padding: 7px 0 7px 10px;
    border-left: 2px solid var(--red);
  }

  .linha-topo {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    gap: 12px;
  }

  .nome {
    font-size: 14px;
    color: var(--text);
  }

  .contagem {
    font-family: var(--sans);
    font-size: 11px;
    color: var(--red);
    white-space: nowrap;
    flex-shrink: 0;
  }

  .variantes {
    font-family: var(--sans);
    font-size: 11px;
    color: var(--muted);
  }

  .erro { color: var(--red); font-family: var(--sans); font-size: 13px; }
</style>
</head>
<body>
  <h1>Checador de Duplicados</h1>

  <div id="status" class="status">Carregando...</div>
  <div id="conteudo"></div>

  <script>
    function atualizar() {
      fetch('/api/duplicados')
        .then(r => r.json())
        .then(data => {
          const status = document.getElementById('status');
          const conteudo = document.getElementById('conteudo');

          if (data.error) {
            status.innerHTML = '<span class="erro">Erro: ' + JSON.stringify(data.error) + '</span>';
            conteudo.innerHTML = '';
            return;
          }

          const contagem = data.contagem;
          const chaves = Object.keys(contagem).sort((a, b) => a.localeCompare(b));
          const repetidos = chaves.filter(chave => contagem[chave].count > 1);

          if (repetidos.length === 0) {
            status.innerHTML = `
              <span class="ponto ok"></span>
              <span><span class="destaque ok">${data.total}</span> artigos analisados, nenhuma repetição</span>
            `;
            conteudo.innerHTML = '';
          } else {
            status.innerHTML = `
              <span class="ponto alerta"></span>
              <span><span class="destaque alerta">${repetidos.length}</span> repetido${repetidos.length > 1 ? 's' : ''} de ${data.total} analisados</span>
            `;

            let html = '';
            repetidos.forEach(chave => {
              const item = contagem[chave];
              const temVariacao = item.variantes.length > 1;
              html += `<div class="linha">
                <div class="linha-topo">
                  <span class="nome">${item.exibicao}</span>
                  <span class="contagem">${item.count}x</span>
                </div>
                ${temVariacao ? `<span class="variantes">${item.variantes.map(v => '"' + v + '"').join(', ')}</span>` : ''}
              </div>`;
            });
            conteudo.innerHTML = html;
          }
        })
        .catch(err => {
          document.getElementById('status').innerHTML = '<span class="erro">Erro ao carregar: ' + err.message + '</span>';
        });
    }

    atualizar();
    setInterval(atualizar, 2000);
  </script>
</body>
</html>
