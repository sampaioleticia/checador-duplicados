<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Checador de Duplicados</title>
<style>
  body {
    background: #191919;
    color: #e9e9e7;
    font-family: Georgia, 'Times New Roman', serif;
    max-width: 640px;
    margin: 0 auto;
    padding: 48px 24px;
  }
  h1 { font-size: 28px; font-weight: 600; margin-bottom: 4px; color: #fff; }
  .subtitulo { color: #9b9b9b; font-size: 14px; margin-bottom: 32px;
    font-family: -apple-system, 'Segoe UI', sans-serif; }
  .linha { display: flex; justify-content: space-between; align-items: center;
    padding: 14px 16px; margin-bottom: 8px; background: #202020;
    border: 1px solid #2f2f2f; border-radius: 6px; }
  .nome { font-size: 16px; }
  .badge { font-size: 12px; padding: 3px 10px; border-radius: 12px; white-space: nowrap;
    font-family: -apple-system, 'Segoe UI', sans-serif; }
  .resumo { margin-top: 32px; padding-top: 16px; border-top: 1px solid #2f2f2f;
    color: #9b9b9b; font-size: 13px; font-family: -apple-system, 'Segoe UI', sans-serif; }
  .carregando, .erro { color: #9b9b9b; font-family: -apple-system, 'Segoe UI', sans-serif; }
</style>
</head>
<body>
  <h1>Checador de Duplicados</h1>
  <div class="subtitulo">Nome do Artigo &middot; base de dados do Notion</div>
  <div id="conteudo" class="carregando">Carregando...</div>

  <script>
    fetch('/api/duplicados')
      .then(r => r.json())
      .then(data => {
        const container = document.getElementById('conteudo');
        if (data.error) {
          container.className = 'erro';
          container.textContent = 'Erro: ' + JSON.stringify(data.error);
          return;
        }
        const contagem = data.contagem;
        const nomes = Object.keys(contagem).sort((a, b) => a.localeCompare(b));
        let html = '';
        let duplicados = 0;

        nomes.forEach(nome => {
          const vezes = contagem[nome];
          const dup = vezes > 1;
          if (dup) duplicados++;
          const corFundo = dup ? 'rgba(235,87,87,0.15)' : 'rgba(45,194,117,0.12)';
          const corTexto = dup ? '#ff8080' : '#4dd58a';
          const corBorda = dup ? 'rgba(235,87,87,0.35)' : 'rgba(77,213,138,0.3)';
          const status = dup ? `Já foi lido &middot; usado ${vezes}x` : 'Livre';
          html += `<div class="linha">
            <span class="nome">${nome}</span>
            <span class="badge" style="background:${corFundo}; color:${corTexto}; border:1px solid ${corBorda};">${status}</span>
          </div>`;
        });

        html += `<div class="resumo">${nomes.length} artigos verificados &middot; ${duplicados} repetidos</div>`;
        container.className = '';
        container.innerHTML = html;
      })
      .catch(err => {
        const container = document.getElementById('conteudo');
        container.className = 'erro';
        container.textContent = 'Erro ao carregar: ' + err.message;
      });
  </script>
</body>
</html>
