<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Checador de Duplicados</title>
<style>
  :root {
    --bg: #191919;
    --card: #1f1f1f;
    --border: rgba(255,255,255,0.07);
    --text: #e9e9e7;
    --muted: #8a8a88;
    --red: #ff7369;
    --red-bg: rgba(255,115,105,0.09);
    --red-border: rgba(255,115,105,0.22);
    --green: #52b8a3;
    --green-bg: rgba(82,184,163,0.08);
    --green-border: rgba(82,184,163,0.22);
    --sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
    --serif: Georgia, 'Iowan Old Style', 'Times New Roman', serif;
  }

  * { box-sizing: border-box; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--serif);
    max-width: 580px;
    margin: 0 auto;
    padding: 64px 24px 80px;
  }

  h1 {
    font-size: 26px;
    font-weight: 600;
    letter-spacing: -0.01em;
    color: #fdfdfc;
    margin: 0 0 32px;
  }

  .hero {
    padding: 32px 28px;
    border-radius: 10px;
    margin-bottom: 28px;
    border: 1px solid;
  }

  .hero.ok {
    background: var(--green-bg);
    border-color: var(--green-border);
  }

  .hero.alerta {
    background: var(--red-bg);
    border-color: var(--red-border);
  }

  .hero .numero {
    font-family: var(--sans);
    font-size: 48px;
    font-weight: 600;
    line-height: 1;
    margin-bottom: 8px;
  }

  .hero.ok .numero { color: var(--green); }
  .hero.alerta .numero { color: var(--red); }

  .hero .rotulo {
    font-family: var(--sans);
    font-size: 14px;
    color: var(--text);
    opacity: 0.75;
  }

  .secao-titulo {
    font-family: var(--sans);
    font-size: 13px;
    color: var(--muted);
    margin-bottom: 10px;
  }

  .linha {
    display: flex;
    flex-direction: column;
    gap: 2px;
    padding: 10px 14px;
    margin-bottom: 5px;
    background: var(--card);
    border: 1px solid var(--border);
    border-left: 2px solid var(--red);
    border-radius: 5px;
  }

  .linha-topo {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 16px;
  }

  .nome {
    font-size: 15px;
    color: var(--text);
  }

  .contagem {
    font-family: var(--sans);
    font-size: 11px;
    color: var(--red);
    white-space: nowrap;
    flex-shrink: 0;
  }

  .variantes {
    font-family: var(--sans);
    font-size: 11px;
    color: var(--muted);
  }

  .carregando, .erro {
    font-family: var(--sans);
    color: var(--muted);
    font-size: 14px;
  }

  .erro { color: var(--red); }
</style>
</head>
<body>
  <h1>Checador de Duplicados</h1>

  <div id="hero" class="hero"><div class="carregando">Carregando...</div></div>

  <div id="lista-titulo" class="secao-titulo" style="display:none;">Artigos repetidos</div>
  <div id="conteudo"></div>

  <script>
    function atualizar() {
      fetch('/api/duplicados')
        .then(r => r.json())
        .then(data => {
          const hero = document.getElementById('hero');
          const conteudo = document.getElementById('conteudo');
          const listaTitulo = document.getElementById('lista-titulo');

          if (data.error) {
            hero.className = 'hero alerta';
            hero.innerHTML = '<div class="erro">Erro: ' + JSON.stringify(data.error) + '</div>';
            conteudo.innerHTML = '';
            listaTitulo.style.display = 'none';
            return;
          }

          const contagem = data.contagem;
          const chaves = Object.keys(contagem).sort((a, b) => a.localeCompare(b));
          const repetidos = chaves.filter(chave => contagem[chave].count > 1);

          if (repetidos.length === 0) {
            hero.className = 'hero ok';
            hero.innerHTML = `
              <div class="numero">${data.total}</div>
              <div class="rotulo">artigos analisados &middot; nenhuma repetição encontrada</div>
            `;
            listaTitulo.style.display = 'none';
            conteudo.innerHTML = '';
          } else {
            hero.className = 'hero alerta';
            hero.innerHTML = `
              <div class="numero">${repetidos.length}</div>
              <div class="rotulo">artigo${repetidos.length > 1 ? 's' : ''} repetido${repetidos.length > 1 ? 's' : ''} encontrado${repetidos.length > 1 ? 's' : ''}</div>
            `;
            listaTitulo.style.display = 'block';

            let html = '';
            repetidos.forEach(chave => {
              const item = contagem[chave];
              const temVariacao = item.variantes.length > 1;
              html += `<div class="linha">
                <div class="linha-topo">
                  <span class="nome">${item.exibicao}</span>
                  <span class="contagem">usado ${item.count}x</span>
                </div>
                ${temVariacao ? `<span class="variantes">variações encontradas: ${item.variantes.map(v => '"' + v + '"').join(', ')}</span>` : ''}
              </div>`;
            });
            conteudo.innerHTML = html;
          }
        })
        .catch(err => {
          const hero = document.getElementById('hero');
          hero.className = 'hero alerta';
          hero.innerHTML = '<div class="erro">Erro ao carregar: ' + err.message + '</div>';
        });
    }

    atualizar();
    setInterval(atualizar, 2000);
  </script>
</body>
</html>
